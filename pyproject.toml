[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ocr-evolution-engine"
version = "1.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "PyMuPDF>=1.25,<2"]

[project.optional-dependencies]
test = ["httpx>=0.27,<1"]

[tool.setuptools.package-data]
ocr_engine = ["web/*"]
