name: OCR C2.2 real-source transcriptions and CER WER
on:
  pull_request:
    paths:
      - 'ocr_evolution/c22_*.py'
      - 'tests/test_c22*.py'
      - 'docs/OCR_EVOLUTION_C22.md'
      - '.github/workflows/ocr-evolution-c22.yml'
  push:
    branches: [feat/ocr-evolution-c1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  human-review-contracts:
    name: Reviewer, license and accuracy contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[test]"
      - name: Human review and source-integrity regression tests
        run: python -m unittest discover -s tests -p "test_c22*.py" -v

  real-photo-smoke:
    name: Pinned real Korean scene photos + receipt intake
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      OCR_C22_EXTERNAL_DATA_CONSENT: '1'
      HF_HUB_DOWNLOAD_TIMEOUT: '90'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Tesseract and Korean OCR language data
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-kor
      - name: Install OCR and pinned external dataset reader
        run: |
          python -m pip install -e ".[test]"
          python -m pip install "huggingface_hub>=0.34,<2"
      - name: Actual Korean camera crop OCR + unreviewed receipt acquisition
        run: python -m ocr_evolution.c22_public --output-dir reports/c22
      - name: Display measured numbers and explicit unreviewed data limitations
        run: cat reports/c22/results.md
      - name: Upload ONLY hashes, measured counts and rights provenance
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c22-real-korean-ocr-metrics-no-images
          path: reports/c22/
          if-no-files-found: warn
          retention-days: 14
