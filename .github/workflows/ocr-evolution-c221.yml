name: OCR C2.2.1 human-reviewed physical-scan audit gates
on:
  push:
    branches: [feat/ocr-evolution-c1]
  pull_request:
    paths:
      - 'ocr_evolution/c221_audit.py'
      - 'ocr_evolution/c221_source_intake.py'
      - 'benchmarks/c221_real_receipt_review_queue.json'
      - 'tests/test_c221_source_intake.py'
      - 'tools/c221_offline_reviewer.html'
      - 'tests/test_c221_audit.py'
      - 'docs/OCR_EVOLUTION_C221.md'
      - '.github/workflows/ocr-evolution-c221.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review-contracts:
    name: Two-reviewer offline contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install OCR test dependency
        run: python -m pip install -e ".[test]"
      - name: Strict 2-10 batch contract regression tests, synthetic fixtures only
        run: python -m unittest discover -s tests -p "test_c221*.py" -v
  actual-human-evidence:
    name: Actual two-human scan evidence status (BLOCKED until supplied)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only local OCR test dependencies for status import
        run: python -m pip install -e ".[test]"
      - name: Generate honest independent gate status
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/c221-status
          python -m ocr_evolution.c221_audit --ci-status > reports/c221-status/status.json
          cat reports/c221-status/status.json
          grep -q BLOCKED_MISSING_INDEPENDENT_HUMAN_REVIEW_EVIDENCE reports/c221-status/status.json
          echo "GATE=BLOCKED; regression checks never certify human review" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish non-sensitive blocked gate receipt only
        uses: actions/upload-artifact@v4
        with:
          name: c221-gate-BLOCKED-no-human-scans
          path: reports/c221-status/status.json
          retention-days: 14

  public-source-replay:
    name: Hash-pinned Korean receipt images (2, unreviewed; real network)
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      OCR_C221_EXTERNAL_DATA_CONSENT: '1'
      HF_HUB_DOWNLOAD_TIMEOUT: '90'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install strict source verification dependencies
        run: |
          python -m pip install -e ".[test]"
          python -m pip install "huggingface_hub>=0.34,<2"
      - name: Replay exact pinned source download outside Git checkout
        shell: bash
        run: |
          set -euo pipefail
          python -m ocr_evolution.c221_source_intake \
            --queue benchmarks/c221_real_receipt_review_queue.json \
            --private-dir "$RUNNER_TEMP/c221-private-source"
          mkdir -p reports/c221-source-evidence
          cp "$RUNNER_TEMP/c221-private-source/REVIEW_STATUS.json" \
             reports/c221-source-evidence/status.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("reports/c221-source-evidence/status.json").read_text())
          assert d["source_images_checked"] == 2
          assert d["physical_capture_verified"] is False
          assert d["two_independent_full_human_transcriptions"] == 0
          assert d["actual_paper_scan_cer"] is None
          assert d["actual_paper_scan_wer"] is None
          assert d["promotion_eligible"] is False
          print("Actual source bytes verified: 2; independent real-paper/human review: BLOCKED")
          PY
          echo "PUBLIC INPUTS=2 EXACT HASH MATCH; PAPER ORIGIN/HUMAN GT=BLOCKED" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload ONLY redacted source provenance and blocked evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c221-public-source-replay-no-images
          path: reports/c221-source-evidence/status.json
          if-no-files-found: warn
          retention-days: 14
